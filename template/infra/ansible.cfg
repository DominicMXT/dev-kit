[defaults]
display_skipped_hosts = false
display_ok_hosts = false

vault_password_file = vault-password.txt
inventory = hosts.yml

callback_result_format = yaml
check_mode_markers = true
show_task_path_on_failure = true
pipelining = true
jinja2_native = true
ansible_managed = This file is managed by Ansible, changes will be lost. Source: {file}
force_handlers = true
any_errors_fatal = true
private_role_vars = true

fact_caching = jsonfile
fact_caching_connection = .ansible-fact-cache
gathering = smart

[diff]
always = true

[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=20
