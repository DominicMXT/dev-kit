os_ip_forward: false

os_lshw: false
os_atop: true
os_chrony: true
os_unattended_upgrades: false
os_unattended_upgrades_reboot: false
os_unattended_upgrades_manage: true

os_logrotate_renamecopy: false
os_logrotate_copytruncate: false

os_logrotate_frequency: daily

os_htop_containers: '{{ "docker" in ansible_role_names }}'

os_ncdu_version: '2.9.1'


ansible_managed: 'Managed by Ansible. Do not edit. Submit changes via pull request.
  Role: {{ ansible_role_name | d("task") }}, template: {{ template_path | d("inline") }}'

os_timezone: Europe/Moscow

os_vm_useless_packages:
- linux-firmware
- fwupd
- fwupd-signed
- libfwupd2
- intel-microcode
- wireless-regdb

os_kernel_args_redhat: selinux=0 psi=1
os_kernel_remove_args_redhat: crashkernel
