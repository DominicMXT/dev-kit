weekly
{% if ansible_facts.distribution == 'Ubuntu' %}
su root adm
{% endif %}

maxsize 100M
maxage 365
{% if ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version | int <= 10 or
      ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_major_version | int <= 20 or
      ansible_facts.os_family == 'RedHat' and ansible_facts.distribution_major_version | int <= 7 %}
rotate 365
{% else %}
rotate -1
{% endif %}
dateext
olddir archive
createolddir 2775 root root
compress
compresscmd /usr/bin/zstd
uncompresscmd /usr/bin/unzstd
compressoptions -15 --rm
compressext .zst
delaycompress
notifempty
missingok
{% if os_logrotate_renamecopy %}
renamecopy
{% elif os_logrotate_copytruncate %}
copytruncate
{% endif %}

include /etc/logrotate.d

{% if ansible_facts.os_family == 'RedHat' and ansible_facts.distribution_major_version | int <= 7 or
      ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version | int <= 9 or
      ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_major_version | int <= 18 %}
/var/log/wtmp {
    missingok
    monthly
    create 0664 root utmp
    minsize 1M
    rotate 1
}

/var/log/btmp {
    missingok
    monthly
    create 0660 root utmp
    rotate 1
}
{% endif %}
