{% if nginx_env_http_extra is defined %}
{{ nginx_env_http_extra }}
{% endif %}
server {
{% if nginx_env_acme_challenge != 'none' %}
    listen {{ nginx_address ~ ':' if nginx_address is defined }}{{ nginx_https_port }} ssl{{ ' http2' if nginx_version is version('1.24', '<=') }};
    listen [{{ nginx_address_ipv6 }}]:{{ nginx_https_port }} ssl{{ ' http2' if nginx_version is version('1.24', '<=') }};
{% if nginx_env_http3 and nginx_version is version('1.25', '>=') %}
    listen {{ nginx_address ~ ':' if nginx_address is defined }}{{ nginx_https_port }} quic;
    listen [{{ nginx_address_ipv6 }}]:{{ nginx_https_port }} quic;
    add_header Alt-Svc $alt_svc_header always;
{% endif %}
    add_header Strict-Transport-Security 'max-age=16070400; includeSubDomains' always;
{% elif nginx_listen_http %}
    listen {{ nginx_address ~ ':' if nginx_address is defined }}{{ nginx_http_port }};
    listen [{{ nginx_address_ipv6 }}]:{{ nginx_http_port }};
{% endif %}
    server_name {{ nginx_domains | join(' ') }};
    {{ nginx_env_logs | indent }}
    root {{ nginx_env_base_dir }}/{{ nginx_env_root }};

{% if nginx_env_basic_login is truthy %}
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/conf.d/{{ env_name }}.passwd;
{% endif %}
{% if nginx_env_server_extra is defined %}
    {{ nginx_env_server_extra | indent }}
{% endif %}
{% if nginx_env_strip_www and nginx_domains | select('regex', '^www\.') %}
    if ($host ~ ^www\.(?<canon_host>.+)$) {
        return 308 https://$canon_host$request_uri;
    }
{% endif %}
{% if nginx_env_acme_challenge != 'none' %}
    ssl_certificate     /etc/letsencrypt/live/{{ nginx_tls_cert_name }}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{ nginx_tls_cert_name }}/privkey.pem;
{% endif %}
}
{% if nginx_env_acme_challenge != 'none' and nginx_env_redirect_to_https and nginx_listen_http %}
server {
    listen {{ nginx_address ~ ':' if nginx_address is defined }}{{ nginx_http_port }};
    listen [{{ nginx_address_ipv6 }}]:{{ nginx_http_port }};
    server_name {{ nginx_domains | join(' ') }};
    {{ nginx_env_logs | indent }}
    {{ nginx_env_redirect_to_https | indent }}
}
{% endif %}
