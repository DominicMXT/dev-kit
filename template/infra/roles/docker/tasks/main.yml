- name: Run as root
  become: true
  block:

  - name: Docker key
    get_url:
      url: https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg
      dest: /etc/apt/keyrings/docker.asc
    when:
    - not ansible_check_mode
    - ansible_facts.os_family == 'Debian'

  - name: Docker repository
    copy:
      content: >
        deb [signed-by=/etc/apt/keyrings/docker.asc]
        https://download.docker.com/linux/{{ ansible_facts.distribution | lower }} {{ ansible_facts.distribution_release }} stable
      dest: /etc/apt/sources.list.d/docker.list
    notify: Update apt cache
    when: ansible_facts.os_family == 'Debian'

  - name: Update apt cache with new repository before installing new package
    meta: flush_handlers

  - name: Install Docker
    apt:
      name:
      - docker-ce
      - docker-compose-plugin
      - docker-buildx-plugin
      - pigz
      install_recommends: false
    ignore_errors: '{{ ansible_check_mode }}'
    when: ansible_facts.os_family == 'Debian'

  - name: Add repository
    copy:
      content: |
        [docker-ce-stable]
        name=Docker CE Stable - $basearch
        baseurl=https://download.docker.com/linux/centos/$releasever/$basearch/stable
        enabled=1
        gpgcheck=1
        gpgkey=https://download.docker.com/linux/centos/gpg
      dest: /etc/yum.repos.d/docker-ce.repo
    when: ansible_facts.os_family == 'RedHat'

  - name: Install Docker
    dnf:
      name:
      - nftables
      - docker-ce
      - docker-compose-plugin
      - docker-buildx-plugin
      - pigz
    ignore_errors: '{{ ansible_check_mode }}'
    when: ansible_facts.os_family == 'RedHat'

  - name: Config
    template:
      src: daemon.json
      dest: /etc/docker/
    notify: Reload Docker


  - name: Docker DNS - directory
    file:
      path: /etc/systemd/resolved.conf.d
      state: directory
    become: true
    when: docker_force_host_dns

  - name: Docker DNS - config
    copy:
      content: |
        [Resolve]
        DNSStubListenerExtra=172.17.0.1
      dest: /etc/systemd/resolved.conf.d/docker.conf
    notify: Restart systemd-resolved
    when: docker_force_host_dns


  - name: Start Docker
    systemd:
      name: docker
      state: started
      enabled: true
    become: true
    ignore_errors: '{{ ansible_check_mode }}'
