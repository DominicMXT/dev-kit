/var/log/nginx/*.log {
    {{ nginx_logrotate_frequency }}
    maxsize 100M
    maxage {{ nginx_maxage }}
{% if ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version | int <= 10 or
      ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_major_version | int <= 20 or
      ansible_facts.os_family == 'RedHat' and ansible_facts.distribution_major_version | int <= 7 %}
    rotate 365
{% else %}
    rotate -1
{% endif %}
{% if nginx_log_dateext %}
    dateext
{% if nginx_logrotate_frequency == 'hourly' %}
    dateformat -%Y%m%d-%H
    datehourago
{% else %}
    dateyesterday
{% endif %}
{% else %}
    nodateext
{% endif %}
    olddir archive
    createolddir 2775 root root
    compress
    compresscmd /usr/bin/zstd
    uncompresscmd /usr/bin/unzstd
    compressoptions -15 --rm {{- ' --threads=' ~ [ansible_facts.processor_nproc // 3, 8] | min if ansible_facts.processor_nproc >= 6 }}
    compressext .zst
    {{ 'no' if not nginx_delaycompress }}delaycompress
    notifempty
    missingok
    sharedscripts
{% if nginx_renamecopy and not nginx_copytruncate %}
    renamecopy
{% endif %}
{% if nginx_copytruncate and not nginx_renamecopy %}
    copytruncate
{% else %}
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid)
    endscript
{% endif %}
}
