user nginx;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log notice;
worker_processes {{ nginx_worker_processes }};
worker_rlimit_nofile 10024;
pcre_jit on;
events {
    worker_connections 10024;
    multi_accept on;
}
http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;
    tcp_nopush on;

    sendfile on;
    aio threads;
    aio_write on;
    directio 4m;

    gzip on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_types text/plain text/xml application/xhtml+xml image/x-icon text/css application/javascript
        text/javascript application/x-javascript text/x-js text/ecmascript
        application/ecmascript text/vbscript text/fluffscript image/svg+xml
        application/xml+rss application/atom+xml application/xml application/json
        application/x-font-ttf application/x-font font/opentype font/otf font/ttf
        application/x-font-truetype application/x-font-opentype
        text/comma-separated-values application/x-ns-proxy-autoconfig;

    log_format combined_ext
        '$time_iso8601 status:$status time:$request_time ip:$remote_addr\t$scheme://$host "$request" '
        'up_status:"$upstream_status" up_time:"$upstream_response_time" up_addr:"$upstream_addr" '
{% if nginx_log_time_length_debug %}
        'up_conn_time:"$upstream_connect_time" up_head_time:"$upstream_header_time" '
        'resp_body_length:$body_bytes_sent '
{% endif %}
        'req_length:$request_length resp_length:$bytes_sent '
        '{{ 'cache:$upstream_cache_status ' if nginx_log_cache }}complete:"$request_completion" '
        '{{ 'limit:$limit_req_status ' if nginx_log_limit }}{{
          'tls:$ssl_protocol ' if nginx_log_tls }}{{
          'basic:$remote_user ' if nginx_log_basic }}{{
          'orig_ip:$realip_remote_addr ' if nginx_log_realip }}{{
          'x_real_ip:$http_x_real_ip ' if nginx_log_realip_debug }}ref:"$http_referer" agent:"$http_user_agent"';
    access_log /var/log/nginx/access.log combined_ext buffer=2m flush=1s;

{% if nginx_http_extra_config is defined %}
    {{ nginx_http_extra_config | indent }}
{% endif %}
    client_max_body_size {{ nginx_client_max_body_size }};
    client_body_buffer_size 128k;
{% if nginx_server_names_hash_max_size is defined %}
    server_names_hash_max_size {{ nginx_server_names_hash_max_size }};
{% endif %}
{% if nginx_server_names_hash_bucket_size is defined %}
    server_names_hash_bucket_size {{ nginx_server_names_hash_bucket_size }};
{% endif %}
    map $http_x_forwarded_proto $real_scheme {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }
    map $http_upgrade $connection_header {
        default       '';
        ~*^websocket  Upgrade;
    }
{% if nginx_http3 and nginx_version is version('1.25', '>=') %}
    map $http3 $alt_svc_header {
        '' 'h3=":443"; ma=86400; persist=1';
        h3 '';
    }
{% endif %}

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $real_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
{% if nginx_websockets_proxy_pass %}
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_header;

    proxy_http_version 1.1;
{% endif %}
    proxy_connect_timeout 10s;
    proxy_redirect off;
    proxy_buffers 128 16k;
    proxy_buffer_size 16k;

{% if nginx_tls %}
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:{{ nginx_ssl_session_cache_size }};
    ssl_dhparam ssl-dhparams.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_early_data on;
    resolver 127.0.0.53;

{% endif %}
{% if nginx_version is version('1.25', '>=') %}
    quic_gso on;
    http2 on;

{% endif %}
    server {
        listen 80 reuseport deferred default_server;
        listen [::]:80 reuseport deferred default_server;
{% if nginx_tls %}
        listen 443 ssl reuseport deferred default_server{{ ' http2' if nginx_version is version('1.24', '<=') }};
        listen [::]:443 ssl reuseport deferred default_server{{ ' http2' if nginx_version is version('1.24', '<=') }};
{% if nginx_http3 and nginx_version is version('1.25', '>=') %}
        listen 443 quic reuseport default_server;
        listen [::]:443 quic reuseport default_server;
{% endif %}
{% if ansible_facts.os_family == 'Debian' %}
        ssl_certificate     /etc/ssl/certs/dummy.pem;
        ssl_certificate_key /etc/ssl/private/dummy.key;
{% else %}
        ssl_certificate     /etc/pki/tls/certs/dummy.pem;
        ssl_certificate_key /etc/pki/tls/private/dummy.key;
{% endif %}
{% endif %}
        location = /nginx-status {
            stub_status;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }
        location / {
            return 404;
        }
    }

    include conf.d/*.conf;
    include sites-enabled/*;
}
{% if nginx_extra_config is defined %}
{{ nginx_extra_config }}
{% endif %}
